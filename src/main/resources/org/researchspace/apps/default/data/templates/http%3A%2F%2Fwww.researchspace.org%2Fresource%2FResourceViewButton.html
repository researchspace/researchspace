[[!-- Keep the editor frame mounted so switching views retains unsaved input. --]]
<mp-event-trigger id='{{viewId}}-view-resource'
                  type='Dashboard.AddFrame'
                  targets='["thinking-frames"]'
                  data='{"viewId": "{{#if resourceVisualisationTemplateIRI}}resource-detailed-visualisation{{else}}resource{{/if}}",
                         "resourceIri": "{{iri}}",
                         "resourceConfig": "{{resourceConfiguration}}"{{#if resourceVisualisationTemplateIRI}},
                         "resourceVisualisationTemplate": "{{resourceVisualisationTemplateIRI}}"{{/if}} }'>
  <button type="button" class="resource-record-header__action">
    <rs-icon icon-type="rounded" icon-name="frame_inspect" symbol="true" aria-hidden="true"></rs-icon>
    <span>View</span>
  </button>
</mp-event-trigger>
