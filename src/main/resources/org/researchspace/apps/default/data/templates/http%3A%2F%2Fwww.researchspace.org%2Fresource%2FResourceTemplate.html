[[#if (urlParam "frame")]]
<style>
  .rs-application .page.page-local-overwrite {
    padding-top: 0;
  }
</style>
  [[#if (urlParam "resourceIri")]]
    <div class="page page-local-overwrite">
      [[> rsp:ResourceContent  iri=(urlParam "resourceIri") frameView=true]] 
    </div>
  [[/if]]

[[else]]
  [[#if (urlParam "uri")]]
  [[!-- Resource Page --]]
    <div class="page">
    [[> rsp:ResourceContent iri=(urlParam "uri") frameView=false]]
    </div>
  [[/if]]
[[/if]]
