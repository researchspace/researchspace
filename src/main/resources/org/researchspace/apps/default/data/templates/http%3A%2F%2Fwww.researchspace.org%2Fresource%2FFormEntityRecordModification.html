<div class="semantic-form-hidden-fields" style="visibility:hidden; height:0; overflow:hidden;">
  [[!-- The form is re-mounted after every save so that each Form.Save creates a new
        modification event with a fresh subject, instead of re-inserting onto the subject
        generated by the previous save (initialState stays a placeholder after a create). --]]
  <mp-event-proxy id='{{formId}}-remount-proxy'
                  on-event-source='{{formId}}'
                  on-event-types='["Form.ResourceCreated"]'
                  proxy-event-type='Component.TemplateUpdate'
                  proxy-targets='["{{formId}}-render"]'
  ></mp-event-proxy>

  <mp-event-target-template-render id='{{formId}}-render' template='{{> form}}'>
    <template id='form'>
      <semantic-form  id='{{formId}}'
                      new-subject-template='{{node}}/entity_form_record/entity_formRecord_modification/{{{{raw}}}}{{UUID}}{{{{/raw}}}}'
                      post-action="event"
                      persistence='{"type": "sparql", "targetInsertGraphIri":"{{#if scheme}}{{scheme}}/extended_context{{else}}http://www.researchspace.org/resource/g/data{{/if}}"}'
                      fields='[
                        {
                          "id": "classtype",
                          "iri": "http://www.w3.org/1999/02/22-rdf-syntax-ns#type",
                          "label": "rdf type",
                          "xsdDatatype": "http://www.w3.org/2001/XMLSchema#anyURI",
                          "selectPattern": "SELECT DISTINCT ?value WHERE { $subject <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> ?value . }",
                          "insertPattern": "INSERT { $subject <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> $value } WHERE {}",
                          "deletePattern": "DELETE { $subject <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> $value } WHERE { $subject <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> $value }"
                        },
                        {
                          "id": "entity_resource_type",
                          "iri": "http://www.researchspace.org/pattern/system/entity/resource_type",
                          "label": "Resource type",
                          "xsdDatatype": "http://www.w3.org/2001/XMLSchema#anyURI",
                          "minOccurs": 0,
                          "maxOccurs": "unbound",
                          "selectPattern": "SELECT DISTINCT ?value WHERE { $subject crm:P2_has_type $value . ?value crm:P71i_is_listed_in <http://www.researchspace.org/resource/system/vocab/resource_type> . }",
                          "insertPattern": "INSERT { $subject crm:P2_has_type $value . $value crm:P2i_is_type_of $subject . } WHERE {}",
                          "deletePattern": "DELETE { $subject crm:P2_has_type $value . $value crm:P2i_is_type_of $subject . } WHERE { $subject crm:P2_has_type $value . $value crm:P2i_is_type_of $subject . ?value crm:P71i_is_listed_in <http://www.researchspace.org/resource/system/vocab/resource_type> . }"
                        },
                        {
                          "id": "modification_had_output_record",
                          "iri": "http://www.researchspace.org/pattern/system/entityFormRecordModification/had_output_record",
                          "label": "Entity form record modification had output record",
                          "xsdDatatype": "http://www.w3.org/2001/XMLSchema#anyURI",
                          "minOccurs": 0,
                          "maxOccurs": 1,
                          "selectPattern": "SELECT DISTINCT ?value WHERE { ?subject crmdig:L11_had_output ?value . ?subject crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_modification> . ?value crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record> . }",
                          "insertPattern": "INSERT { ?subject crmdig:L11_had_output ?value . ?value crmdig:L11i_was_output_of ?subject . } WHERE {}",
                          "deletePattern": "DELETE { ?subject crmdig:L11_had_output ?value . ?value crmdig:L11i_was_output_of ?subject . } WHERE { ?subject crmdig:L11_had_output ?value . ?subject crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_modification> . ?value crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record> . }"
                        },
                        {
                          "id": "modification_at_save_time",
                          "label": "Modification time (taken at save)",
                          "description": "Records the time-span of the modification event using the triplestore clock at the moment the update executes, rather than a value rendered into the page when the form was opened. The field value is only a trigger and is never stored. NOW() is truncated to YYYY-MM-DDTHH:mm:ss without a timezone so it sorts and compares with existing values written by currentDateTime.",
                          "xsdDatatype": "http://www.w3.org/2001/XMLSchema#string",
                          "minOccurs": 0,
                          "maxOccurs": 1,
                          "selectPattern": "SELECT DISTINCT ?value WHERE { ?subject crm:P4_has_time-span ?date . ?date a crm:E52_Time-Span . ?date crm:P82_at_some_time_within ?value . }",
                          "insertPattern": "INSERT { ?subject crm:P4_has_time-span ?date . ?date a crm:E52_Time-Span . ?date crm:P82_at_some_time_within ?now . } WHERE { BIND(IRI(CONCAT(STR(?subject), \"/at_some_time_within/\", STRUUID())) AS ?date) BIND(STRDT(SUBSTR(STR(NOW()), 1, 19), <http://www.w3.org/2001/XMLSchema#dateTime>) AS ?now) }",
                          "deletePattern": "DELETE { ?subject crm:P4_has_time-span ?date . ?date a crm:E52_Time-Span . ?date crm:P82_at_some_time_within ?time . } WHERE { ?subject crm:P4_has_time-span ?date . ?date a crm:E52_Time-Span . ?date crm:P82_at_some_time_within ?time . }"
                        },
                        {
                          "id": "modification_carried_out_by",
                          "iri": "http://www.researchspace.org/pattern/system/activity/carried_out_by",
                          "label": "Carried out by",
                          "xsdDatatype": "http://www.w3.org/2001/XMLSchema#anyURI",
                          "minOccurs": 0,
                          "maxOccurs": "unbound",
                          "selectPattern": "SELECT DISTINCT ?value WHERE { ?subject crm:P14_carried_out_by ?value . }",
                          "insertPattern": "INSERT { ?subject crm:P14_carried_out_by ?value . ?value crm:P14i_performed ?subject . } WHERE {}",
                          "deletePattern": "DELETE { ?subject crm:P14_carried_out_by ?value . ?value crm:P14i_performed ?subject . } WHERE { ?subject crm:P14_carried_out_by ?value . ?value crm:P14i_performed ?subject . }"
                        },
                        {
                          "id": "modification_latest_activity",
                          "allowDeleteInInsertPattern": true,
                          "label": "Latest activity on the form record",
                          "description": "Keeps a single last-activity entry per form record: the newest modification event of the record is typed entity_form_record_latest_event, so its time-span and carried_out_by give the last activity date and actor in one row per record. The value is the form record; on save the marker is moved from the previous latest modification of the record to this one in one update. Only the record is read, so the update does not depend on the other fields of this form, which are written in parallel. Records with no modification are not marked; readers fall back to the creation event.",
                          "xsdDatatype": "http://www.w3.org/2001/XMLSchema#anyURI",
                          "minOccurs": 0,
                          "maxOccurs": 1,
                          "selectPattern": "SELECT DISTINCT ?value WHERE { ?subject crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_latest_event> . ?subject crmdig:L11_had_output ?value . }",
                          "insertPattern": "DELETE { GRAPH ?previousGraph { ?previous crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_latest_event> . <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_latest_event> crm:P2i_is_type_of ?previous . } } INSERT { ?subject crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_latest_event> . <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_latest_event> crm:P2i_is_type_of ?subject . } WHERE { OPTIONAL { ?value crmdig:L11i_was_output_of ?previous . GRAPH ?previousGraph { ?previous crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_latest_event> . } } }",
                          "deletePattern": "DELETE { ?subject crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_latest_event> . <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_latest_event> crm:P2i_is_type_of ?subject . } WHERE { ?subject crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_latest_event> . }"
                        }
                      ]'>

          <semantic-form-hidden-input for="classtype" default-value="http://www.cidoc-crm.org/extensions/crmdig/D7_Digital_Machine_Event"></semantic-form-hidden-input>
          <semantic-form-hidden-input for="entity_resource_type" default-value='http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_modification'></semantic-form-hidden-input>

          <semantic-form-hidden-input for="modification_had_output_record" default-value="{{node}}/entity_form_record" force-defaults=true></semantic-form-hidden-input>
          <semantic-form-hidden-input for="modification_at_save_time" default-value="now" force-defaults=true></semantic-form-hidden-input>
          <semantic-form-hidden-input for="modification_carried_out_by" default-value='[[userUri]]' force-defaults=true></semantic-form-hidden-input>
          <semantic-form-hidden-input for="modification_latest_activity" default-value="{{node}}/entity_form_record" force-defaults=true></semantic-form-hidden-input>
      </semantic-form>
    </template>
  </mp-event-target-template-render>
</div>
