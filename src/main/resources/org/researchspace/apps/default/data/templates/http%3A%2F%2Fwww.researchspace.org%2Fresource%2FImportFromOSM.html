<semantic-search>
  <semantic-search-query-keyword  domain='<http://www.cidoc-crm.org/cidoc-crm/E53_Place>'
                                  placeholder="Search place"
                                  min-search-term-length=3
                                  tokenize-lucene-query=false
                                  escape-lucene-syntax=false
                                  debounce=500
                                  query=' PREFIX osm: <http://www.researchspace.org/resource/system/services/osm/>
                                          SELECT ?subject WHERE {
                                            SERVICE osm:NominatimSearchService {
                                              ?subject osm:q ?__token__ .
                                              # polygon_text "0": NO geometry in the search - country
                                              # boundaries are megabytes of WKT. The Map cell fetches
                                              # geometry per row with a size-appropriate simplification
                                              # threshold; the bounding box (always returned) is what it
                                              # judges the entity size by.
                                              ?subject osm:polygon_text "0" .
                                              ?subject osm:display_name ?placeName.
                                              ?subject osm:wikidata ?wikidataId .
                                              ?subject osm:osm_type ?osmType .
                                              ?subject osm:osm_id ?osmId .
                                              ?subject osm:bbox_min_lat ?bboxMinLat .
                                              ?subject osm:bbox_max_lat ?bboxMaxLat .
                                              ?subject osm:bbox_min_lon ?bboxMinLon .
                                              ?subject osm:bbox_max_lon ?bboxMaxLon .
                                              ?subject osm:ordinal ?ordinal .
                                            }
                                          }'
  ></semantic-search-query-keyword>

  <semantic-search-result-holder>
    <div style="margin-top: 25px;">
      <semantic-search-result>
        <div class="wikipediaResultsTable">
          <!-- A single federated query provides all row data: the Nominatim search
               results (injected from the keyword query above) are enriched with
               label, description and image from the wikidata-sparql federation
               member in one batched call; ORDER BY ?ordinal restores Nominatim's
               relevance ranking. The cells below only render bindings.

               ?osmPlaceURI is ALWAYS bound: places without a wikidata tag get a
               sentinel IRI (wd:Q0-NO-WIKIDATA-TAG) that matches nothing at the
               endpoint, so they come back unenriched but survive the OPTIONAL.
               Per SPARQL semantics an UNBOUND join variable would instead make
               the service patterns unanchored and cross-product the row against
               the whole remote dataset - never leave it unbound (the engine
               logs a warning if it ever is). The cells only use ?osmPlaceURI
               for rows that have a real ?wikidataId. -->
          <semantic-context repository='ephedra'>
            <semantic-table id='semantic-search-result-table'
                            class-name="table-striped"
                            query='PREFIX wd: <http://www.wikidata.org/entity/>
                                   PREFIX wdt: <http://www.wikidata.org/prop/direct/>
                                   PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
                                   PREFIX schema: <http://schema.org/>
                                   SELECT ?subject ?placeName ?wikidataId ?osmPlaceURI ?ordinal
                                          ?osmType ?osmId ?bboxMinLat ?bboxMaxLat ?bboxMinLon ?bboxMaxLon
                                          (SAMPLE(?_placeLabel) AS ?placeLabel)
                                          (SAMPLE(?_placeDescription) AS ?placeDescription)
                                          (SAMPLE(?_placeImage) AS ?placeImage)
                                   WHERE {
                                     BIND(?subject as ?iri) .
                                     BIND(IRI(CONCAT(STR(wd:), COALESCE(?wikidataId, "Q0-NO-WIKIDATA-TAG"))) AS ?osmPlaceURI)
                                     OPTIONAL {
                                       SERVICE <http://www.researchspace.org/resource/system/repository/federation#wikidata-sparql> {
                                         OPTIONAL { ?osmPlaceURI rdfs:label ?_placeLabel . FILTER(LANG(?_placeLabel) = "en") }
                                         OPTIONAL { ?osmPlaceURI schema:description ?_placeDescription . FILTER(LANG(?_placeDescription) = "en") }
                                         OPTIONAL { ?osmPlaceURI wdt:P18 ?_placeImage . }
                                       }
                                     }
                                   }
                                   GROUP BY ?subject ?placeName ?wikidataId ?osmPlaceURI ?ordinal
                                            ?osmType ?osmId ?bboxMinLat ?bboxMaxLat ?bboxMinLon ?bboxMaxLon
                                   ORDER BY ?ordinal'

                            options='{"showFilter":false, "resultsPerPage":4}'
                            column-configuration='[
                                    {"displayName": "Place name", "cellTemplate": "{{> placeName}}" },
                                    {"displayName": "Description (from Wikidata)", "cellTemplate": "{{> wikidata}}"},
                                    {"displayName": "Image", "cellTemplate": "{{> images}}"},
                                    {"displayName": "Map", "cellTemplate": "{{> placeMap}}" },
                                    {"displayName": "Actions", "cellTemplate": "{{> actions}}" }
                                  ]'
            >

              <template id='placeName'>
                <div>
                  <span style="margin-right: 5px;">
                    {{#if wikidataId.value}}
                      <a class="text-link-action"
                          target="_blank"
                          href="http://www.wikidata.org/entity/{{wikidataId.value}}"
                          title="http://www.wikidata.org/entity/{{wikidataId.value}}">
                        {{placeName.value}}
                      </a>
                    {{else}}
                      {{placeName.value}}
                    {{/if}}
                  </span>
                  <mp-copy-to-clipboard text='{{placeName.value}}' message='Place name has been copied'>
                    <rs-icon icon-type="rounded" icon-name="file_copy" symbol="true" style="cursor: pointer;" title="Copy place name"></rs-icon>
                  </mp-copy-to-clipboard>

                </div>
              </template>

              <template id='wikidata'>
                <div>
                  {{#if placeDescription.value}}
                    {{placeDescription.value}}
                  {{/if}}
                </div>
              </template>

              <template id='placeMap'>
                <div style='height: 210px; width: 20vw;'>
                  {{#if osmId.value}}
                    <!-- Geometry is fetched per row, NOT carried by the table query:
                         it arrives as a query result binding (safe at any size),
                         never inlined into query text (a country boundary is
                         megabytes of WKT - inlining it crashes the client query
                         parser). The re-search is joined back to THIS row by
                         osm_type + osm_id, which - unlike the wikidata tag -
                         every OSM result has. The simplification threshold is
                         picked from the entity's bounding box so only BIG
                         entities are simplified:
                         > 2 deg span: 0.01 deg (~1 km, sub-pixel on this preview);
                         > 0.2 deg: 0.001 deg (~110 m); small entities: full
                         geometry. One rate-limited Nominatim call per rendered
                         row - acceptable for 4 rows per page. -->
                    <semantic-context repository='ephedra'>
                      <semantic-map query='PREFIX osm: <http://www.researchspace.org/resource/system/services/osm/>
                                           PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
                                           SELECT ?wkt WHERE {
                                             BIND(xsd:double("{{bboxMaxLat.value}}") - xsd:double("{{bboxMinLat.value}}") AS ?latSpan)
                                             BIND(xsd:double("{{bboxMaxLon.value}}") - xsd:double("{{bboxMinLon.value}}") AS ?lonSpan)
                                             BIND(IF(?latSpan > ?lonSpan, ?latSpan, ?lonSpan) AS ?span)
                                             BIND(IF(?span > 2.0, "0.01", IF(?span > 0.2, "0.001", "0.0")) AS ?threshold)
                                             SERVICE osm:NominatimSearchService {
                                               ?result osm:q """{{placeName.value}}""" ;
                                                       osm:polygon_threshold ?threshold ;
                                                       osm:geotext ?wkt ;
                                                       osm:osm_type ?resultOsmType ;
                                                       osm:osm_id ?resultOsmId .
                                             }
                                             FILTER(?resultOsmType = "{{osmType.value}}" && ?resultOsmId = "{{osmId.value}}")
                                           }'
                                        tuple-template='<div style="display:flex; flex-direction:column; gap:5px;">
                                                      <b style="color:#525156;">{{placeName.value}}</b>
                                                      {{#if wikidataId.value}}
                                                        <div>
                                                          <a style="color:#396EFE;"
                                                              target="_blank"
                                                              href="http://www.wikidata.org/entity/{{wikidataId.value}}"
                                                              title="http://www.wikidata.org/entity/{{wikidataId.value}}">
                                                            Open in wikidata
                                                          </a>
                                                        </div>
                                                      {{/if}}
                                                    </div>'>
                      </semantic-map>
                    </semantic-context>
                  {{/if}}
                </div>
              </template>

              <template id='images'>
                <div>
                  {{#if placeImage.value}}
                    <a href="{{placeImage.value}}"
                      title="{{placeImage.value}}"
                      target="_blank">

                      <img src="{{placeImage.value}}"
                          width="auto" height="180" style="max-width: 15vw; object-fit: contain;">
                    </a>
                  {{/if}}
                </div>
              </template>

              <template id='actions'>
                <div>
                  {{#if wikidataId.value}}
                    <div style="display: flex; flex-direction: column; gap: 7px; align-items: end; min-width: 116px;">
                      {{#if importFromModal}}
                        <mp-event-trigger id='{{viewId}}-select-api-resource-trigger'
                                          type='apiResourceImportInModal'
                                          data='{"apiResourceURI": "{{osmPlaceURI.value}}",
                                                  "apiResourceName": "{{placeName.value}}",
                                                  "apiResourceDescription": "{{placeDescription.value}}",
                                                  "apiResourceWikidataId": "{{wikidataId.value}}"
                                                }'
                                    >
                          <button class="btn btn-action" title="Import place">Import</button>
                        </mp-event-trigger>
                      {{else}}
                        <bs-dropdown-button pull-right=true id='{{viewId}}-import-dropdown-{{__semanticTableIndex.value}}' title="Import as" class="btn-action">
                          <mp-event-trigger id='{{viewId}}-import-from-osm-trigger-place-{{__semanticTableIndex.value}}'
                                            type='Form.Save'
                                            targets='["{{viewId}}-place-import-form-{{__semanticTableIndex.value}}"]'>
                            <bs-menu-item draggable='false' style="text-transform: capitalize;">place</bs-menu-item>
                          </mp-event-trigger>
                          <mp-event-trigger id='{{viewId}}-import-from-osm-trigger-organisation-{{__semanticTableIndex.value}}'
                                            type='Form.Save'
                                            targets='["{{viewId}}-organisation-import-form-{{__semanticTableIndex.value}}"]'>
                            <bs-menu-item draggable='false' style="text-transform: capitalize;">organisation</bs-menu-item>
                          </mp-event-trigger>
                          <mp-event-trigger id='{{viewId}}-import-from-osm-trigger-site-{{__semanticTableIndex.value}}'
                                            type='Form.Save'
                                            targets='["{{viewId}}-site-import-form-{{__semanticTableIndex.value}}"]'>
                            <bs-menu-item draggable='false' style="text-transform: capitalize;">site</bs-menu-item>
                          </mp-event-trigger>
                        </bs-dropdown-button>

                        <div style='display: none;'>
                          <inline-template  template-iri='http://www.researchspace.org/resource/system/forms/ImportFromOSM'
                                            options='{
                                                      "formId": "{{viewId}}-place-import-form-{{__semanticTableIndex.value}}",
                                                      "mode": "new",
                                                      "apiResourceURI": "{{osmPlaceURI.value}}",
                                                      "apiResourceName": "{{placeName.value}}",
                                                      "apiResourceDescription": "{{placeDescription.value}}",
                                                      "apiResourceWikidataId": "{{wikidataId.value}}",
                                                      "resourceName": "place",
                                                      "resourceOntologyClass": "http://www.cidoc-crm.org/cidoc-crm/E53_Place"
                                                    }'>
                          </inline-template>
                          <inline-template  template-iri='http://www.researchspace.org/resource/system/forms/ImportFromOSM'
                                            options='{
                                                      "formId": "{{viewId}}-organisation-import-form-{{__semanticTableIndex.value}}",
                                                      "mode": "new",
                                                      "apiResourceURI": "{{osmPlaceURI.value}}",
                                                      "apiResourceName": "{{placeName.value}}",
                                                      "apiResourceDescription": "{{placeDescription.value}}",
                                                      "apiResourceWikidataId": "{{wikidataId.value}}",
                                                      "resourceName": "organisation",
                                                      "resourceP2Type": "http://www.researchspace.org/resource/system/vocab/resource_type/organisation",
                                                      "resourceOntologyClass": "http://www.cidoc-crm.org/cidoc-crm/E53_Place"
                                                    }'>
                          </inline-template>
                          <inline-template  template-iri='http://www.researchspace.org/resource/system/forms/ImportFromOSM'
                                            options='{
                                                      "formId": "{{viewId}}-site-import-form-{{__semanticTableIndex.value}}",
                                                      "mode": "new",
                                                      "apiResourceURI": "{{osmPlaceURI.value}}",
                                                      "apiResourceName": "{{placeName.value}}",
                                                      "apiResourceDescription": "{{placeDescription.value}}",
                                                      "apiResourceWikidataId": "{{wikidataId.value}}",
                                                      "resourceName": "site",
                                                      "resourceOntologyClass": "http://www.cidoc-crm.org/cidoc-crm/E27_Site"
                                                    }'>
                          </inline-template>
                        </div>

                        <mp-event-proxy id='{{viewId}}-import-on-form-save-place-{{__semanticTableIndex.value}}'
                                        on-event-source='{{viewId}}-place-import-form-{{__semanticTableIndex.value}}'
                                        on-event-types='["Form.ResourceCreated"]'
                                        additional-data='{"importedFromOSM": "true"}'
                                        proxy-event-type='Component.TemplateUpdate'
                                        proxy-targets='["{{viewId}}-open-record-dropdown-render-{{__semanticTableIndex.value}}"]'>
                        </mp-event-proxy>
                        <mp-event-proxy id='{{viewId}}-import-on-form-save-organisation-{{__semanticTableIndex.value}}'
                                        on-event-source='{{viewId}}-organisation-import-form-{{__semanticTableIndex.value}}'
                                        on-event-types='["Form.ResourceCreated"]'
                                        additional-data='{"importedFromOSM": "true"}'
                                        proxy-event-type='Component.TemplateUpdate'
                                        proxy-targets='["{{viewId}}-open-record-dropdown-render-{{__semanticTableIndex.value}}"]'>
                        </mp-event-proxy>
                        <mp-event-proxy id='{{viewId}}-import-on-form-save-site-{{__semanticTableIndex.value}}'
                                        on-event-source='{{viewId}}-site-import-form-{{__semanticTableIndex.value}}'
                                        on-event-types='["Form.ResourceCreated"]'
                                        additional-data='{"importedFromOSM": "true"}'
                                        proxy-event-type='Component.TemplateUpdate'
                                        proxy-targets='["{{viewId}}-open-record-dropdown-render-{{__semanticTableIndex.value}}"]'>
                        </mp-event-proxy>
                      {{/if}}
                      <mp-event-target-template-render id='{{viewId}}-open-record-dropdown-render-{{__semanticTableIndex.value}}' template='{{> template}}'>
                        <template id='template'>
                          <!-- Existing records are matched by the import-from-external-source
                               chain on the wikidata-derived URI (the same mechanism the
                               MET/VAM/TNA/Wikidata import pages use; FormEntityRecord stores
                               it for every import made from this page). Matching by geometry
                               text equality would be fragile - it breaks whenever OSM edits
                               the boundary - and would require carrying megabytes of WKT
                               into this query. -->
                          <semantic-context repository='default'>
                            <semantic-query query='SELECT DISTINCT ?existingRecord ?existingRecordLabel WHERE {
                                                    BIND(<{{osmPlaceURI.value}}> AS ?osmSourceURI)

                                                    ?existingRecord crm:P129i_is_subject_of ?entityFormRecord .
                                                    ?entityFormRecord a crmdig:D1_Digital_Object .
                                                    ?entityFormRecord crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record> .
                                                    ?entityFormRecord crmdig:L11i_was_output_of ?entityFormRecordCreation .
                                                    ?entityFormRecordCreation crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/entity_form_record_creation> .
                                                    ?entityFormRecordCreation crm:P134_continued ?importFromExternalSource .
                                                    ?importFromExternalSource a crmdig:D12_Data_Transfer_Event .
                                                    ?importFromExternalSource crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/import_from_external_source> .
                                                    ?importFromExternalSource crmdig:L14_transferred ?osmSourceURI .
                                                    ?osmSourceURI a crmdig:D1_Digital_Object .
                                                    ?osmSourceURI crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/digital_object_type/web_link> .

                                                    ?existingRecord crm:P1_is_identified_by ?appellation .
                                                    ?appellation crm:P2_has_type <http://www.researchspace.org/resource/system/vocab/resource_type/primary_appellation> .
                                                    ?appellation crm:P190_has_symbolic_content ?existingRecordLabel .
                                                  }'

                                            template='{{> template}}'>

                              <template id='template'>
                                <bs-dropdown-button pull-right=true id='{{viewId}}-open-record-dropdown-{{__semanticTableIndex.value}}' title="Open record">
                                  {{#each bindings}}
                                    <mp-event-trigger id='{{../viewId}}-openExistingRecord-in-new-frame-trigger'
                                                        type='Dashboard.AddFrame'
                                                        data='{"viewId":"resource-editor",
                                                              "resourceIri":"{{existingRecord.value}}",
                                                              "mode":"edit" }'
                                                        targets='["thinking-frames"]'>
                                        <bs-menu-item draggable='true'>{{existingRecordLabel.value}}</bs-menu-item>
                                    </mp-event-trigger>
                                  {{/each}}
                                </bs-dropdown-button>
                              </template>
                            </semantic-query>
                          </semantic-context>
                        </template>
                      </mp-event-target-template-render>
                    </div>
                  {{else}}
                    <div style="display: flex; flex-direction: column; gap: 7px; align-items: end; min-width: 116px;">
                      <mp-popover title="Place without wikidata tag">
                        <mp-popover-trigger placement="left" trigger='["hover", "click"]'>
                          <button class="btn btn-default btn-textAndIcon">
                            <rs-icon icon-type="rounded" icon-name="question_mark" symbol="true"></rs-icon>
                          </button>
                        </mp-popover-trigger>
                        <mp-popover-content>
                          <div>This place can't be imported because the OpenStreetMap record has no wikidata tag; the import stores the wikidata entity as the record's source and uses it to link the geographic coordinates.</div>
                        </mp-popover-content>
                      </mp-popover>
                    </div>
                  {{/if}}
                </div>
              </template>

            </semantic-table>
          </semantic-context>
        </div>
      </semantic-search-result>
    </div>
  </semantic-search-result-holder>

</semantic-search>
