<semantic-search
  id="structured-search-example-search"
  categories='{
    "<http://www.w3.org/2001/XMLSchema#string>": [{
      "kind": "text",
      "tokenizeLuceneQuery": false,
      "queryPattern": "$subject <http://www.cidoc-crm.org/cidoc-crm/P1_is_identified_by> ?appellation .
        ?appellation a <http://www.cidoc-crm.org/cidoc-crm/E41_Appellation> ;
          <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <http://www.researchspace.org/resource/system/vocab/resource_type/primary_appellation> ;
          <http://www.cidoc-crm.org/cidoc-crm/P190_has_symbolic_content> ?title .
        FILTER(CONTAINS(LCASE(STR(?title)), LCASE(STR(?__value__)))) ."
    }],
    "<http://www.w3.org/2001/XMLSchema#dateTime>": [{
      "kind": "date-range",
      "datatype": "http://www.w3.org/2001/XMLSchema#dateTime",
      "format": "YYYY-MM-DDTHH:mm:ssZ",
      "queryPattern": "$subject <http://www.cidoc-crm.org/cidoc-crm/P108i_was_produced_by>/<http://www.cidoc-crm.org/cidoc-crm/P9_consists_of>*/<http://www.cidoc-crm.org/cidoc-crm/P4_has_time-span> ?timeSpan .
        ?timeSpan <http://www.cidoc-crm.org/cidoc-crm/P82a_begin_of_the_begin> ?begin .
        ?timeSpan <http://www.cidoc-crm.org/cidoc-crm/P82b_end_of_the_end> ?end .
        FILTER(?begin <= ?__dateEndValue__) .
        FILTER(?end >= ?__dateBeginValue__) ."
    }]
  }'
  search-profile='{
    "categories": [
      {
        "iri": "<http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object>",
        "label": "Human-made object",
        "thumbnail": "/assets/images/icons/rs-icons/thing.svg"
      },
      {
        "iri": "<http://www.cidoc-crm.org/cidoc-crm/E39_Actor>",
        "label": "Creator",
        "thumbnail": "/assets/images/icons/rs-icons/actor.svg"
      },
      {
        "iri": "<http://www.cidoc-crm.org/cidoc-crm/E55_Type>",
        "label": "Object type",
        "thumbnail": "/assets/images/icons/rs-icons/type.svg"
      },
      {
        "iri": "<http://www.w3.org/2001/XMLSchema#string>",
        "label": "Title",
        "thumbnail": "/assets/images/icons/rs-icons/keyword.svg"
      },
      {
        "iri": "<http://www.w3.org/2001/XMLSchema#dateTime>",
        "label": "Production date",
        "thumbnail": "/assets/images/icons/rs-icons/date.svg"
      }
    ],
    "relations": [
      {
        "iri": "<http://www.cidoc-crm.org/cidoc-crm/P14_carried_out_by>",
        "label": "Creator",
        "hasDomain": "<http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object>",
        "hasRange": "<http://www.cidoc-crm.org/cidoc-crm/E39_Actor>"
      },
      {
        "iri": "<http://www.cidoc-crm.org/cidoc-crm/P2_has_type>",
        "label": "Object type",
        "hasDomain": "<http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object>",
        "hasRange": "<http://www.cidoc-crm.org/cidoc-crm/E55_Type>"
      },
      {
        "iri": "<http://www.cidoc-crm.org/cidoc-crm/P190_has_symbolic_content>",
        "label": "Title",
        "hasDomain": "<http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object>",
        "hasRange": "<http://www.w3.org/2001/XMLSchema#string>"
      },
      {
        "iri": "<http://www.cidoc-crm.org/cidoc-crm/P4_has_time-span>",
        "label": "Production date",
        "hasDomain": "<http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object>",
        "hasRange": "<http://www.w3.org/2001/XMLSchema#dateTime>"
      }
    ]
  }'
  relations='{
    "<http://www.cidoc-crm.org/cidoc-crm/P14_carried_out_by>": [{
      "kind": "resource",
      "queryPattern": "$subject <http://www.cidoc-crm.org/cidoc-crm/P108i_was_produced_by>/<http://www.cidoc-crm.org/cidoc-crm/P9_consists_of>* ?production .
        ?production <http://www.cidoc-crm.org/cidoc-crm/P14_carried_out_by> ?__value__ ."
    }],
    "<http://www.cidoc-crm.org/cidoc-crm/P190_has_symbolic_content>": [{
      "kind": "literal",
      "queryPattern": "$subject <http://www.cidoc-crm.org/cidoc-crm/P1_is_identified_by> ?appellation .
        ?appellation a <http://www.cidoc-crm.org/cidoc-crm/E41_Appellation> ;
          <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <http://www.researchspace.org/resource/system/vocab/resource_type/primary_appellation> ;
          <http://www.cidoc-crm.org/cidoc-crm/P190_has_symbolic_content> ?__literal__ ."
    }]
  }'
  [[#if presetFacets]] preset-facets='[[presetFacets]]' [[/if]]
>
  [[> @partial-block ]]

  <div data-flex-layout="row stretch-stretch">
    <div data-flex-self="size-1of3" style="min-width: 280px; max-width: 360px;">
      <semantic-search-facet
        id="structured-search-example-facet"
        open-by-default="true"
        hide-toggle-button="true"
        default-value-queries='{
          "resource": "SELECT ?value (SAMPLE(?displayLabel) AS ?label) (COUNT(DISTINCT $subject) AS ?count) WHERE {
            FILTER(?__facetRelationPattern__)
            OPTIONAL {
              ?value <http://www.cidoc-crm.org/cidoc-crm/P1_is_identified_by> ?labelAppellation .
              ?labelAppellation a <http://www.cidoc-crm.org/cidoc-crm/E41_Appellation> ;
                <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <http://www.researchspace.org/resource/system/vocab/resource_type/primary_appellation> ;
                <http://www.cidoc-crm.org/cidoc-crm/P190_has_symbolic_content> ?rawLabel .
            }
            BIND(COALESCE(?rawLabel, STR(?value)) AS ?displayLabel)
          } GROUP BY ?value ORDER BY ?label"
        }'
      ></semantic-search-facet>
    </div>

    <semantic-search-result-holder data-flex-self="md-full">
      <div>
        <semantic-search-facet-breadcrumbs></semantic-search-facet-breadcrumbs>

        <semantic-search-result>
          <mp-sparql-result-counts
            id="query-count"
            query="SELECT DISTINCT ?subject {}"
            template='{{#if hasLimit}} <bs-alert bs-style="warning">
              Showing {{numberOfResults}} of {{totalNumberOfResults}} matches. <strong>Please, refine your search.</strong>
              </bs-alert>
              {{else}}<span>Found {{numberOfResults}} matches</span>{{/if}}'
          ></mp-sparql-result-counts>
        </semantic-search-result>

        <bs-tabs unmount-on-exit="true" id="search-results" animation="false">
          <bs-tab event-key="1" title="Grid">
            <semantic-search-result>
              <semantic-table
                id="grid-result"
                query='
                  SELECT ?subject ?title (SAMPLE(?displayThumbnail) AS ?thumbnail)
                  WHERE {
                    {
                      SELECT ?subject ?title WHERE {
                        ?subject <http://www.cidoc-crm.org/cidoc-crm/P1_is_identified_by> ?titleAppellation .
                        ?titleAppellation a <http://www.cidoc-crm.org/cidoc-crm/E41_Appellation> ;
                          <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <http://www.researchspace.org/resource/system/vocab/resource_type/primary_appellation> ;
                          <http://www.cidoc-crm.org/cidoc-crm/P190_has_symbolic_content> ?title .
                      }
                    }
                    OPTIONAL {
                      ?subject <https://artresearch.net/custom/work_preferred_photo>/<https://artresearch.net/custom/thumbnail_url> ?thumbnailPath .
                      BIND(CONCAT("https://artresearch.net", STR(?thumbnailPath)) AS ?artResearchThumbnail)
                    }
                    BIND(COALESCE(?artResearchThumbnail, "/assets/images/icons/rs-icons-no-image/thing_no-image.svg") AS ?displayThumbnail)
                  } GROUP BY ?subject ?title
                '
                tuple-template='{{>tupleTemplate}}'
                options='{"showFilter": false, "resultsPerPage": 30}'
              >
                <template id="tupleTemplate">
                  <div class="rs-grid-element text-center panel panel-default">
                    <div class="panel-body">
                      <img
                        class="img-rounded semantic-search-result-thumbnail"
                        src="{{thumbnail.value}}"
                        alt="{{title.value}}"
                        style="height: 120px; max-width: 150px;"
                      >
                    </div>
                    <div class="panel-footer">
                      <semantic-link class="grid-resource-link" iri="{{subject.value}}">{{title.value}}</semantic-link>
                    </div>
                  </div>
                </template>
              </semantic-table>
            </semantic-search-result>
          </bs-tab>

          <bs-tab event-key="2" title="Table">
            <semantic-search-result>
              <semantic-table
                id="table-result"
                query='SELECT ?subject ?title WHERE {
                  ?subject <http://www.cidoc-crm.org/cidoc-crm/P1_is_identified_by> ?titleAppellation .
                  ?titleAppellation a <http://www.cidoc-crm.org/cidoc-crm/E41_Appellation> ;
                    <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <http://www.researchspace.org/resource/system/vocab/resource_type/primary_appellation> ;
                    <http://www.cidoc-crm.org/cidoc-crm/P190_has_symbolic_content> ?title .
                }'
                options='{"showFilter": false, "resultsPerPage": 30}'
              ></semantic-table>
            </semantic-search-result>
          </bs-tab>

          <bs-tab event-key="3" title="Carousel">
            <semantic-search-result>
              <semantic-carousel
                id="carousel-result"
                query='
                  SELECT ?subject ?title (SAMPLE(?displayThumbnail) AS ?thumbnail)
                  WHERE {
                    {
                      SELECT ?subject ?title WHERE {
                        ?subject <http://www.cidoc-crm.org/cidoc-crm/P1_is_identified_by> ?titleAppellation .
                        ?titleAppellation a <http://www.cidoc-crm.org/cidoc-crm/E41_Appellation> ;
                          <http://www.cidoc-crm.org/cidoc-crm/P2_has_type> <http://www.researchspace.org/resource/system/vocab/resource_type/primary_appellation> ;
                          <http://www.cidoc-crm.org/cidoc-crm/P190_has_symbolic_content> ?title .
                      }
                    }
                    OPTIONAL {
                      ?subject <https://artresearch.net/custom/work_preferred_photo>/<https://artresearch.net/custom/thumbnail_url> ?thumbnailPath .
                      BIND(CONCAT("https://artresearch.net", STR(?thumbnailPath)) AS ?artResearchThumbnail)
                    }
                    BIND(COALESCE(?artResearchThumbnail, "/assets/images/icons/rs-icons-no-image/thing_no-image.svg") AS ?displayThumbnail)
                  } GROUP BY ?subject ?title
                '
                tuple-template='{{>carouselTupleTemplate}}'
                options='{"centerMode": true, "dots": false}'
              >
                <template id="carouselTupleTemplate">
                  <div class="text-center panel panel-default" style="border: none; margin-right: 20px; font-size: 12px; height: 300px; width: 100%;">
                    <div class="panel-body" style="height: 280px;">
                      <img
                        class="img-rounded semantic-search-result-thumbnail"
                        src="{{thumbnail.value}}"
                        alt="{{title.value}}"
                        style="max-height: 260px; margin: 0 auto;"
                      >
                    </div>
                    <div class="panel-footer" style="position: relative; border: none;">
                      <semantic-link class="grid-resource-link" iri="{{subject.value}}">{{title.value}}</semantic-link>
                    </div>
                  </div>
                </template>
              </semantic-carousel>
            </semantic-search-result>
          </bs-tab>
        </bs-tabs>

        <bs-panel>
          <semantic-search-result>
            <mp-sparql-download
              id="csv-download"
              query="SELECT * WHERE { }"
              header="text/csv"
              filename="csv-result.csv"
            >
              <button class="btn btn-default">Download CSV</button>
            </mp-sparql-download>
          </semantic-search-result>
          <semantic-search-result>
            <mp-sparql-download
              id="json-download"
              query="SELECT * WHERE { }"
              header="application/sparql-results+json"
              filename="json-result.json"
            >
              <button class="btn btn-default">Download JSON</button>
            </mp-sparql-download>
          </semantic-search-result>
        </bs-panel>
      </div>
    </semantic-search-result-holder>
  </div>
</semantic-search>
