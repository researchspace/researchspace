<div class="page__grid-container help-page-container structured-constant-search-example">
  <div class='page__content-container'>
    [[> Help:StructuredSearchSampleDataCheck]]
    <p>
      Shows all human-made objects from a constant query and lets facets refine the result set.
    </p>

    <mp-code-example>
    <![CDATA[
[[#> Help:StructuredSearchExampleBase]]
  <semantic-search-query-constant 
    domain='<http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object>'
    query="
      SELECT ?subject WHERE {
        ?subject a <http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object> .
      }
    "
  ></semantic-search-query-constant>
[[/ Help:StructuredSearchExampleBase]]
      ]]>
    </mp-code-example>
  </div>
</div>
