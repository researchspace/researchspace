
[[!-- Frame-aware navigation also works outside Thinking Frames. Inside the
      workspace it activates the view without unmounting the editor frame. --]]
{{log "view button" this}}
<semantic-link-container uri="http://www.researchspace.org/resource/ThinkingFrames"
                         urlqueryparam-view="{{#if resourceVisualisationTemplateIRI}}resource-detailed-visualisation{{else}}resource{{/if}}"
                         urlqueryparam-resource="{{iri}}"
                         urlqueryparam-resource-config="{{resourceConfiguration}}"
                         urlqueryparam-resource-visualisation-template="{{resourceVisualisationTemplateIRI}}"
                         >
  <button type="button" class="resource-record-header__action">
    <rs-icon icon-type="rounded" icon-name="frame_inspect" symbol="true" aria-hidden="true"></rs-icon>
    <span>View</span>
  </button>
</semantic-link-container>
