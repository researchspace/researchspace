<div class="page__grid-container help-page-container structured-keyword-search-example">
  <div class='page__content-container'>
    [[> Help:StructuredSearchSampleDataCheck]]
    <p>
      Try to type <i>Mona Lisa</i> to search the titles of human-made objects.
    </p>
    <mp-code-example>
    <![CDATA[
[[#> Help:StructuredSearchExampleBase]]
  <semantic-search-query-keyword 
    domain='<http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object>'
    default-query='
      SELECT DISTINCT ?subject WHERE {
        ?subject a <http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object> .
      }
    '
    query='
      SELECT DISTINCT ?subject WHERE {
        ?subject a <http://www.cidoc-crm.org/cidoc-crm/E22_Human-Made_Object> ;
          <http://www.cidoc-crm.org/cidoc-crm/P1_is_identified_by>/<http://www.cidoc-crm.org/cidoc-crm/P190_has_symbolic_content> ?title .
        FILTER REGEX(STR(?title), ?__token__, "i")
      }
    '
  ></semantic-search-query-keyword>
[[/ Help:StructuredSearchExampleBase]]
      ]]>
    </mp-code-example>
  </div>
</div>
